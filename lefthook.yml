pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm lint
    format:
      glob: "*.{ts,tsx,json}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    verify:
      run: pnpm verify

commit-msg:
  commands:
    validate:
      run: pnpm exec commitlint --edit {1}
